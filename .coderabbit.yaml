language: ko
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main
      - "1.[0-9]+.[0-9]+"
  path_instructions:
    - path: "LocalPackages/Domain/**"
      instructions: |
        Domain 레이어. 외부 의존성 0(Firebase/UIKit/SwiftUI 금지). Entities/UseCases/Repository 프로토콜만.
        SOLID + POP 준수. 단일 책임 위반/의존성 누수를 지적하라.
    - path: "LocalPackages/Data/**"
      instructions: |
        Data 레이어. Domain 프로토콜 구현. Firebase/Network/GoogleMaps 의존 OK.
        DTO ↔ Entity 변환 누락, 에러 매핑 미흡, 동시성(MainActor 외 작업) 누락 체크.
    - path: "LocalPackages/Feature/**"
      instructions: |
        Feature 레이어. UseCase 프로토콜만 의존(Data/Firebase 직접 import 금지).
        SwiftUI View는 ViewModel 통해서만 상태 변경. View에 비즈니스 로직 누수 체크.
    - path: "LocalPackages/Core/**"
      instructions: |
        Core 유틸리티. 외부 의존성 최소. 로깅/네트워크 헬퍼/DI 컨테이너만.
    - path: "LocalPackages/DesignSystem/**"
      instructions: |
        디자인 토큰 + 컴포넌트. 색상 리터럴 금지(MM2 토큰 통해서만).
        SF Symbols 의존 지양, 직접 SVG 자산 사용.
    - path: "MatchaMap/**/*.swift"
      instructions: |
        앱 본체. 컴포지션 루트 + AppDelegate. UseCase 직접 호출 금지(Feature 통해서).
        @MainActor 기본 — 백그라운드 작업은 명시적 nonisolated.
    - path: "**/*.xcstrings"
      instructions: |
        String Catalog. 6개 언어(ko, en-US, en-GB, de-DE, ja, fr-FR) 모두 채워졌는지 체크.
        독일어 카피가 가장 긴 경우가 많아 레이아웃 오버플로우 가능성 지적.
    - path: "firebase-functions/**"
      instructions: |
        Firebase Cloud Functions. 리전 asia-northeast3. 콜드 스타트 비용/타임아웃 체크.
        보안 규칙(App Check/Auth)과 정합 검증.
    - path: "fastlane/**"
      instructions: |
        CI/CD. dSYM 업로드 누락 체크. build_number = YYMMDD_HHMM 포맷 일관성.
        secrets 하드코딩 시 즉시 차단.
    - path: ".claude/agents/**"
      instructions: |
        에이전트 정의. 팀 통신 프로토콜(누구에게 메시지/태스크) 명시 필수.
        동일 모듈 동시 편집 충돌 가능성 지적.
chat:
  auto_reply: true
